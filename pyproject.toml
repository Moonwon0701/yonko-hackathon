[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yonko-agent"
version = "0.1.0"
description = "Team agent for a capture-the-flag style hackathon game"
requires-python = ">=3.12"

# Runtime dependencies. The game SDK / HTTP client is unknown until day 1 - add it here
# (pinned) as soon as we know what the API needs, so all three machines match.
# 런타임 의존성. 게임 SDK나 HTTP 클라이언트는 1일차 전까지 알 수 없으므로, API에 무엇이
# 필요한지 확인하는 즉시 버전을 고정해 여기에 추가하세요. 그래야 세 대의 컴퓨터가 일치합니다.
dependencies = []

[project.optional-dependencies]
# Pinned exactly: every session must format and lint identically.
# 정확한 버전으로 고정합니다. 모든 세션이 똑같이 서식을 맞추고 똑같이 린트해야 합니다.
dev = [
    "ruff==0.16.8",
    "pytest==9.1.1",
    "pre-commit==4.6.2",
]

[tool.setuptools]
packages = ["agent"]
py-modules = ["arena"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep this list explicit so all three Claude Code sessions lint against the same rules.
# 세 개의 Claude Code 세션이 동일한 규칙으로 린트하도록 목록을 명시적으로 유지합니다.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade - modern syntax for our pinned Python
    "B",   # bugbear - likely bugs
    "SIM", # simplify
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
