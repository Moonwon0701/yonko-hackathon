name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the previous run - we will be pushing often.
# PR에 새로 푸시하면 이전 실행을 취소합니다. 우리는 자주 푸시할 테니까요.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Pinned to the same versions as pyproject.toml's [dev] extra, so CI and every
      # laptop agree on what "formatted" means.
      # pyproject.toml의 [dev] 추가 의존성과 같은 버전으로 고정합니다. 그래야 CI와 모든
      # 노트북이 "서식이 맞다"는 말의 뜻에 합의할 수 있습니다.
      - name: Install tools
        run: pip install "ruff==0.16.8" "pytest==9.1.1" "mdformat==1.0.0" "mdformat-gfm==1.0.0"

      - name: Format check
        run: ruff format --check .

      - name: Markdown format check
        run: mdformat --check --number .

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest
