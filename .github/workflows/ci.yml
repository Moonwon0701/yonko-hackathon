name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the previous run - we will be pushing often.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Pinned to the same versions as pyproject.toml's [dev] extra, so CI and every
      # laptop agree on what "formatted" means.
      - name: Install tools
        run: pip install "ruff==0.16.8" "pytest==9.1.1"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest
