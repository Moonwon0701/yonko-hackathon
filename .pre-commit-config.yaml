# Run `pre-commit install` once after cloning. These hooks are what keep three
# Claude Code sessions producing byte-identical formatting.
#
# 클론한 뒤 `pre-commit install`을 한 번 실행하세요. 세 개의 Claude Code 세션이 바이트 단위로
# 동일한 서식을 내놓게 만드는 장치가 바로 이 훅들입니다.
#
# The ruff rev is pinned and must match the `ruff==` pin in pyproject.toml and the
# version installed in CI. Bump all three together, never one alone.
#
# ruff의 rev는 고정되어 있으며 pyproject.toml의 `ruff==` 핀, CI에 설치되는 버전과 반드시
# 일치해야 합니다. 올릴 때는 셋을 함께 올리고, 하나만 올리지 마세요.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  # Markdown formatting. --number keeps ordered lists numbered 1, 2, 3 in the source
  # instead of collapsing them all to "1." - Claude Code sessions read the raw text.
  # 마크다운 서식. --number는 순서 목록을 원문에서 1, 2, 3으로 유지합니다. 없으면 전부 "1."로
  # 바뀌는데, Claude Code 세션은 렌더링이 아니라 원문을 읽습니다.
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies:
          - mdformat-gfm==1.0.0

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
